server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;

    # Must stay above MAX_UPLOAD_MB or the application's own 50 MB limit is unreachable:
    # nginx's default is 1 MB, so an upload between 1 MB and the configured limit was
    # rejected by the proxy with a 413 before the API ever saw it. Keep this in step with
    # MAX_UPLOAD_MB (and with deploy/nginx/https.conf, which fronts production).
    client_max_body_size 55m;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Cheap orchestrator probes, proxied so the dev stack can be health-checked through
    # the one port it publishes.
    location /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
