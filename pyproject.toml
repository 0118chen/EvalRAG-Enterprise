[project]
name = "evalrag-enterprise"
version = "0.1.0"
description = "An evaluation-driven multi-tenant enterprise RAG platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic-settings>=2.7,<3", "langsmith>=0.3.13,<1", "python-multipart>=0.0.18,<1", "pymupdf>=1.25,<2", "python-docx>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
