[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalrag-enterprise"
version = "0.1.0"
description = "An evaluation-driven multi-tenant enterprise RAG platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "langsmith>=0.3.13,<1", "python-multipart>=0.0.18,<1", "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "pymilvus>=2.5,<3", "elasticsearch[async]>=8.17,<10", "celery[redis]>=5.4,<6", "redis>=5.2,<7", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"]

[project.scripts]
evalrag = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
