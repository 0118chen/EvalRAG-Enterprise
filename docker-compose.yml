services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evalrag
      POSTGRES_USER: evalrag
      POSTGRES_PASSWORD: evalrag
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
      - postgres

  worker:
    build: .
    env_file: .env
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=2
    restart: unless-stopped
    depends_on:
      - redis
      - postgres

volumes:
  redis_data:
  postgres_data:
