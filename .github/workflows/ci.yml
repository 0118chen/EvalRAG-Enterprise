name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # backend / frontend / eval-gate 三个门禁的步骤定义放在 gate-*.yml 里
  # （可复用工作流），release.yml 调用的是同一份定义。GitHub 的 `needs` 不能跨
  # 工作流文件引用 job，所以这是"发布必须等门禁"的唯一不靠复制粘贴的实现方式。
  backend:
    uses: ./.github/workflows/gate-backend.yml

  # 生产跑的是 PostgreSQL，但并发断言（"同一份文档只会被一个 worker 认领"）在
  # 内存 SQLite 上无法验证。这个 job 用真的 PostgreSQL 服务容器跑迁移和并发测试：
  # claim_document 的单条条件 UPDATE、replace_chunks 的原子替换、以及全部 Alembic 迁移
  # 是否能在 PostgreSQL 上执行。测试通过 EVALRAG_TEST_DATABASE_URL 选库，未设置时本地跳过。
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evalrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/evalrag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync the locked environment
        run: uv sync --frozen --extra dev
      - name: Migrate the database
        run: uv run --frozen alembic upgrade head
      - name: Migrations are reversible and rows are claimed exactly once on PostgreSQL
        env:
          EVALRAG_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/evalrag
        run: uv run --frozen pytest tests/test_migrations.py tests/test_concurrency.py -q

  frontend:
    uses: ./.github/workflows/gate-frontend.yml

  eval-gate:
    uses: ./.github/workflows/gate-eval.yml

  # 新增：镜像到底能不能构建。release.yml 只在打 tag 时才 build，而 Dockerfile
  # （或它 COPY 的文件）坏掉通常是平时的提交引入的——等打 tag 那天才发现，
  # tag 已经推出去了。这里在每次 push/PR 就构建一次作为冒烟检查。
  # 全程不登录、不推送、不需要任何密钥；buildx 的 GitHub Actions 缓存让第二次起变快。
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: evalrag-api
            context: .
            file: Dockerfile
          - image: evalrag-frontend
            context: frontend
            file: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          # 两个镜像如果共用 type=gha 的默认 scope，会互相覆盖缓存层，所以按镜像名分 scope。
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # 新增：依赖漏洞审计。uv.lock 已经把每个版本钉死，所以审计对象就是锁文件本身：
  # 先用 `uv export` 把锁文件导成 requirements-txt（--no-emit-project 去掉本仓库自身，
  # 免得去审计一个本地包），再交给 pip-audit。pip-audit 用 uvx 临时拉起，不写进
  # pyproject 依赖——审计工具自己不该进生产依赖树。
  # --no-deps：导出的文件已经是完整闭包，不需要 pip-audit 再解析一遍依赖（更快也更确定）；
  # pip-audit 默认在发现漏洞时以非 0 退出，所以这步天然是门禁。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Export the locked dependencies
        run: >-
          uv export --frozen --format requirements-txt --no-emit-project
          --output-file /tmp/audit-requirements.txt
      - name: Audit the locked dependencies for known vulnerabilities
        run: uvx pip-audit -r /tmp/audit-requirements.txt --no-deps
