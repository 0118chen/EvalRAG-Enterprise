services:
  frontend:
    build: ../frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evalrag
      POSTGRES_USER: evalrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalrag -d evalrag"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  migrate:
    build: ..
    env_file: ../.env.staging
    environment:
      DATABASE_URL: postgresql+psycopg://evalrag:${POSTGRES_PASSWORD}@postgres:5432/evalrag
    command: alembic upgrade head
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ..
    env_file: ../.env.staging
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://evalrag:${POSTGRES_PASSWORD}@postgres:5432/evalrag
      REDIS_URL: redis://redis:6379/0
      CACHE_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
    restart: unless-stopped
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build: ..
    env_file: ../.env.staging
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://evalrag:${POSTGRES_PASSWORD}@postgres:5432/evalrag
      REDIS_URL: redis://redis:6379/0
      CACHE_BACKEND: redis
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "runuser -u appuser -- celery -A app.tasks.celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  uploads_data:
